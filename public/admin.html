<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>SmartNutri Admin - Trang Quản Lý Đơn Hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { -webkit-text-size-adjust: 100%; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes alertPulse {
            0%, 100% { border-color: #f97316; }
            50% { border-color: #ef4444; }
        }
        .new-order-card { animation: alertPulse 1.5s infinite; }
        @media (max-width: 640px) {
            input, select, textarea { font-size: 16px !important; }
            button, a { touch-action: manipulation; }
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-3 sm:p-6" style="padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));">

    <!-- Form đăng nhập (thay cho prompt(), vì một số trình xem trước không hỗ trợ prompt) -->
    <div id="login-box" class="hidden fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <form onsubmit="submitLogin(event)" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 w-full max-w-sm space-y-4">
            <div class="text-center">
                <div class="w-12 h-12 mx-auto rounded-2xl bg-emerald-500 flex items-center justify-center text-slate-950 font-black text-2xl mb-3">⚡</div>
                <h2 class="text-lg font-black text-white">Đăng nhập quản trị</h2>
            </div>
            <input id="login-pw" type="password" placeholder="Nhập mật khẩu quản trị" autocomplete="current-password"
                   class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-sm font-bold text-white outline-none focus:ring-2 focus:ring-emerald-500">
            <p id="login-err" class="text-xs text-rose-400 font-bold min-h-[1rem]"></p>
            <button type="submit" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-sm transition">Vào trang quản lý</button>
        </form>
    </div>

    <div class="max-w-5xl mx-auto">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 sm:pb-6 border-b border-slate-800 mb-5 sm:mb-8">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-emerald-500 flex items-center justify-center text-slate-950 font-black text-xl sm:text-2xl shrink-0">⚡</div>
                <div class="min-w-0">
                    <h1 class="text-lg sm:text-2xl font-black text-white leading-tight">Trang Quản Lý Đơn Hàng</h1>
                    <p class="text-xs text-slate-400">Trạng thái: <span id="status" class="text-emerald-400 font-bold">🟢 Đang kết nối</span></p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="logout()" class="flex-1 sm:flex-none px-4 py-3 sm:py-2 bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 text-xs font-bold rounded-xl transition">Đăng xuất</button>
                <button id="btn-clear" onclick="clearAllOrders()" class="flex-1 sm:flex-none px-4 py-3 sm:py-2 bg-rose-600/20 text-rose-400 border border-rose-500/30 hover:bg-rose-600/30 text-xs font-bold rounded-xl transition">
                    🗑️ Xóa Lịch Sử Đơn
                </button>
            </div>
        </div>

        <div class="flex items-center justify-between gap-2 mb-3 sm:mb-4">
            <h2 class="text-sm sm:text-base font-extrabold text-slate-300">📥 Danh Sách Đơn Hàng:</h2>
            <span id="order-count-badge" class="px-3 py-1 bg-slate-800 text-xs font-bold rounded-full text-slate-300 whitespace-nowrap">0 đơn</span>
        </div>

        <!-- Bộ lọc theo trạng thái: cuộn ngang trên điện thoại -->
        <div id="filter-tabs" class="flex gap-2 mb-4 sm:mb-5 overflow-x-auto sm:flex-wrap no-scrollbar -mx-3 px-3 sm:mx-0 sm:px-0"></div>

        <div id="orders-container" class="space-y-3 sm:space-y-4"></div>
    </div>

    <audio id="order-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const POLL_MS = 5000;
        const container = document.getElementById('orders-container');
        const statusEl = document.getElementById('status');

        let allOrders = [];
        let currentFilter = 'pending';   // 'pending' | 'completed' | 'all'
        let knownIds = null;             // null = lần tải đầu tiên (không phát chuông)
        let highlightIds = new Set();
        let timer = null;

        // Chống XSS: dữ liệu do khách nhập nên luôn escape trước khi chèn vào HTML
        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Đọc ghi chú của khách (object hoặc chuỗi JSON), trả về null nếu không có gì đáng chú ý
        function parseNotes(o) {
            let n = o.notes;
            if (typeof n === 'string') { try { n = JSON.parse(n); } catch (e) { n = { extra: n }; } }
            if (!n || typeof n !== 'object') return null;
            const spice = String(n.spice || '');
            const allergies = Array.isArray(n.allergies) ? n.allergies.map(String) : [];
            const seasoning = Array.isArray(n.seasoning) ? n.seasoning.map(String) : [];
            const extra = String(n.extra || '').trim();
            const hasSpice = spice && spice !== 'Không cay';
            if (!allergies.length && !seasoning.length && !extra && !spice) return null;
            return { spice, hasSpice, allergies, seasoning, extra };
        }

        // Gợi ý thứ tự ăn: rau/salad -> món chính -> ăn nhẹ -> đồ uống (đơn cũ chưa có "cat" thì bỏ qua)
        const EAT_RANK = { salad: 1, main: 2, breakfast: 2, snack: 3, drink: 4 };
        function renderEatOrder(items) {
            const sorted = items
                .filter(i => EAT_RANK[i.cat])
                .map((i, idx) => ({ ...i, idx }))
                .sort((a, b) => EAT_RANK[a.cat] - EAT_RANK[b.cat] || a.idx - b.idx);
            if (sorted.length < 2) return '';
            return `
                <div class="mb-4 p-3 sm:p-4 rounded-2xl border border-emerald-500/30 bg-emerald-500/5">
                    <span class="text-xs font-bold text-emerald-400 block uppercase mb-2">🥢 Gợi ý thứ tự ăn / lên món:</span>
                    <div class="flex flex-wrap items-center gap-1.5">
                        ${sorted.map((d, i) => `
                            ${i > 0 ? '<span class="text-slate-500 text-xs">➔</span>' : ''}
                            <span class="px-2.5 py-1.5 sm:py-1 rounded-md text-[11px] font-bold ${i === 0 ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-200 border border-slate-700'}">${i + 1}. ${esc(d.name)} x${esc(d.qty)}${i === 0 ? ' (ăn đầu tiên)' : ''}</span>`).join('')}
                    </div>
                </div>`;
        }

        function renderNotes(o) {
            const n = parseNotes(o);
            if (!n) return '';
            const danger = n.allergies.length > 0;
            const wrap = danger ? 'border-rose-500/50 bg-rose-500/10' : 'border-amber-500/30 bg-amber-500/5';
            return `
                <div class="mb-4 p-3 sm:p-4 rounded-2xl border ${wrap} space-y-2.5">
                    <span class="text-xs font-bold text-slate-300 block uppercase">📝 Ghi chú của khách cho bếp:</span>
                    ${danger ? `
                        <div class="flex flex-wrap items-center gap-1.5">
                            <span class="text-[11px] font-black text-rose-400 uppercase">⚠️ Dị ứng:</span>
                            ${n.allergies.map(a => `<span class="px-2.5 py-1 rounded-md text-[11px] font-black bg-rose-600 text-white">${esc(a)}</span>`).join('')}
                        </div>` : ''}
                    ${n.spice ? `
                        <div class="flex flex-wrap items-center gap-1.5">
                            <span class="text-[11px] font-black text-orange-400 uppercase">🌶️ Độ cay:</span>
                            <span class="px-2.5 py-1 rounded-md text-[11px] font-black ${n.hasSpice ? 'bg-orange-500/20 text-orange-300 border border-orange-500/40' : 'bg-slate-800 text-slate-300 border border-slate-700'}">${esc(n.spice)}</span>
                        </div>` : ''}
                    ${n.seasoning.length ? `
                        <div class="flex flex-wrap items-center gap-1.5">
                            <span class="text-[11px] font-black text-amber-400 uppercase">🧂 Gia vị:</span>
                            ${n.seasoning.map(s => `<span class="px-2.5 py-1 rounded-md text-[11px] font-bold bg-slate-800 text-slate-200 border border-slate-700">${esc(s)}</span>`).join('')}
                        </div>` : ''}
                    ${n.extra ? `
                        <div>
                            <span class="text-[11px] font-black text-slate-400 uppercase block mb-1">💬 Ghi chú thêm:</span>
                            <p class="text-xs font-semibold text-slate-100 bg-slate-950/60 border border-slate-800 rounded-xl p-3 whitespace-pre-line break-words">${esc(n.extra)}</p>
                        </div>` : ''}
                </div>`;
        }

        let pwMemory = '';
        function getPassword() {
            try { return sessionStorage.getItem('smartnutri_admin_pw') || pwMemory; } catch (e) { return pwMemory; }
        }
        function setPassword(pw) {
            pwMemory = pw;
            try { pw ? sessionStorage.setItem('smartnutri_admin_pw', pw) : sessionStorage.removeItem('smartnutri_admin_pw'); } catch (e) {}
        }

        function showLogin(msg) {
            clearInterval(timer);
            document.getElementById('login-err').textContent = msg || '';
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('login-pw').value = '';
            document.getElementById('login-pw').focus();
        }

        function submitLogin(e) {
            e.preventDefault();
            const pw = document.getElementById('login-pw').value;
            if (!pw) return;
            setPassword(pw);
            document.getElementById('login-box').classList.add('hidden');
            knownIds = null;
            loadOrders();
            clearInterval(timer);
            timer = setInterval(loadOrders, POLL_MS);
        }

        function logout() {
            setPassword('');
            showLogin();
        }

        async function api(method, url = '/api/orders', body) {
            const pw = getPassword();
            if (!pw) throw new Error('NEED_LOGIN');
            const headers = { 'x-admin-password': pw };
            if (body !== undefined) headers['Content-Type'] = 'application/json';
            const res = await fetch(url, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
            if (res.status === 401) {
                setPassword('');
                throw new Error('Sai mật khẩu quản trị.');
            }
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.message || ('Lỗi máy chủ (' + res.status + ')'));
            }
            return res.json();
        }

        async function loadOrders() {
            try {
                const orders = await api('GET');
                statusEl.textContent = '🟢 Đang kết nối (tự cập nhật mỗi 5 giây)';
                statusEl.className = 'text-emerald-400 font-bold';

                const ids = new Set(orders.map(o => o.id));
                if (knownIds !== null) {
                    const fresh = orders.filter(o => !knownIds.has(o.id));
                    if (fresh.length) {
                        fresh.forEach(o => highlightIds.add(o.id));
                        document.getElementById('order-sound').play().catch(() => {});
                        if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} } // rung nhẹ trên điện thoại
                    }
                }
                knownIds = ids;
                allOrders = orders;
                renderOrders();
            } catch (err) {
                if (err.message === 'NEED_LOGIN') return showLogin();
                if (err.message.includes('mật khẩu')) return showLogin(err.message);
                statusEl.textContent = '🔴 ' + err.message;
                statusEl.className = 'text-rose-400 font-bold';
            }
        }

        function isDone(o) { return o.status === 'completed'; }

        function setFilter(f) {
            currentFilter = f;
            renderOrders();
        }

        function renderTabs() {
            const pending = allOrders.filter(o => !isDone(o)).length;
            const done = allOrders.length - pending;
            const tabs = [
                ['pending', `⏳ Chờ xử lý (${pending})`],
                ['completed', `✅ Đã hoàn thiện (${done})`],
                ['all', `Tất cả (${allOrders.length})`]
            ];
            document.getElementById('filter-tabs').innerHTML = tabs.map(([key, label]) => `
                <button onclick="setFilter('${key}')" class="shrink-0 whitespace-nowrap px-4 py-3 sm:py-2 rounded-xl text-xs font-bold border transition ${
                    currentFilter === key
                        ? 'bg-emerald-500 text-slate-950 border-emerald-500'
                        : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-800'
                }">${label}</button>`).join('');
            document.getElementById('order-count-badge').textContent = `${pending} chờ / ${allOrders.length} tổng`;
        }

        function renderOrders() {
            renderTabs();

            const orders = allOrders.filter(o =>
                currentFilter === 'all' ? true : currentFilter === 'completed' ? isDone(o) : !isDone(o));

            if (orders.length === 0) {
                const msg = allOrders.length === 0
                    ? ['Chưa có đơn hàng nào.', 'Khi khách nhấn chốt đơn, đơn sẽ tự hiện ở đây.']
                    : currentFilter === 'pending'
                        ? ['Không còn đơn nào đang chờ xử lý. 🎉', 'Chuyển sang tab "Đã hoàn thiện" để xem lại.']
                        : ['Không có đơn nào trong mục này.', ''];
                container.innerHTML = `
                    <div class="text-center py-14 border-2 border-dashed border-slate-800 rounded-3xl text-slate-500 px-4">
                        <p class="text-sm font-bold">${msg[0]}</p>
                        <p class="text-xs mt-1">${msg[1]}</p>
                    </div>`;
                return;
            }

            container.innerHTML = orders.map(o => {
                const done = isDone(o);
                const isNew = !done && highlightIds.has(o.id);
                const items = Array.isArray(o.items) ? o.items : [];
                const time = new Date(o.created_at).toLocaleString('vi-VN');
                const doneTime = o.completed_at ? new Date(o.completed_at).toLocaleString('vi-VN') : '';
                const notes = parseNotes(o);
                const hasAllergy = !!(notes && notes.allergies.length);
                const border = isNew
                    ? 'border-2 border-orange-500 new-order-card shadow-2xl shadow-orange-500/20'
                    : done ? 'border-emerald-500/30 opacity-75' : 'border-slate-800';
                const btn = 'flex-1 sm:flex-none px-4 py-3 sm:py-2 rounded-xl transition text-center';
                return `
                    <div class="bg-slate-900 border ${border} rounded-3xl p-4 sm:p-6 transition">
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between pb-4 border-b border-slate-800 gap-2">
                            <div class="min-w-0 w-full">
                                <div class="flex flex-wrap gap-1.5 items-center">
                                    <span class="px-2.5 py-1 rounded-md text-[10px] font-black uppercase bg-orange-500/20 text-orange-400 border border-orange-500/30">
                                        Đơn Hàng #${esc(o.id)}
                                    </span>
                                    ${done
                                        ? `<span class="px-2.5 py-1 rounded-md text-[10px] font-black uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">✅ Đã hoàn thiện</span>`
                                        : o.status === 'preparing'
                                            ? `<span class="px-2.5 py-1 rounded-md text-[10px] font-black uppercase bg-blue-500/20 text-blue-400 border border-blue-500/30">👨‍🍳 Đang chuẩn bị</span>`
                                            : `<span class="px-2.5 py-1 rounded-md text-[10px] font-black uppercase bg-amber-500/20 text-amber-400 border border-amber-500/30">⏳ Chờ xử lý</span>`}
                                    ${o.customer_id ? `<span class="px-2.5 py-1 rounded-md text-[10px] font-black uppercase bg-slate-700/50 text-slate-300 border border-slate-600">🔑 Thành viên</span>` : ''}
                                    ${hasAllergy ? `<span class="px-2.5 py-1 rounded-md text-[10px] font-black uppercase bg-rose-600 text-white">⚠️ Có dị ứng</span>` : ''}
                                    ${notes && notes.hasSpice ? `<span class="px-2.5 py-1 rounded-md text-[10px] font-black uppercase bg-orange-500/20 text-orange-300 border border-orange-500/40">🌶️ ${esc(notes.spice)}</span>` : ''}
                                    ${notes && notes.extra ? `<span class="px-2.5 py-1 rounded-md text-[10px] font-black uppercase bg-slate-700/50 text-slate-200 border border-slate-600">📝 Có ghi chú</span>` : ''}
                                </div>
                                <h3 class="text-base sm:text-xl font-black text-white mt-2 break-words">
                                    👤 Khách hàng <span class="text-emerald-400 font-black">${esc(o.customer_name)}</span>${done ? '' : ' vừa chốt đơn!'}
                                </h3>
                                <p class="text-xs text-slate-400 mt-0.5">
                                    SĐT: <a href="tel:${esc(String(o.customer_phone || '').replace(/[^0-9+]/g, ''))}" class="text-sky-400 underline">${esc(o.customer_phone)}</a>
                                    <span class="hidden sm:inline"> | </span><br class="sm:hidden">Thể trạng: BMI ${esc(o.bmi ?? '--')} (${esc(o.bmi_status || '--')})
                                </p>
                            </div>
                            <div class="text-left sm:text-right shrink-0">
                                <span class="text-xs text-slate-400 font-medium">⏰ Thời Gian Đặt: </span>
                                <span class="text-xs font-black text-amber-400">${esc(time)}</span>
                                ${done && doneTime ? `<span class="text-[11px] text-emerald-400 font-bold block mt-1">Hoàn thiện: ${esc(doneTime)}</span>` : ''}
                            </div>
                        </div>

                        <div class="py-4 space-y-2">
                            <span class="text-xs font-bold text-slate-400 block uppercase">Chi Tiết Món Ăn:</span>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                ${items.map(item => `
                                    <div class="flex items-center justify-between gap-3 p-3 bg-slate-950/60 rounded-xl border border-slate-800/80">
                                        <span class="text-xs font-bold text-slate-200 min-w-0 break-words">${esc(item.name)}</span>
                                        <span class="text-xs font-black text-orange-400 whitespace-nowrap">x${esc(item.qty)} (${Number(item.cals * item.qty).toLocaleString()} kcal)</span>
                                    </div>`).join('')}
                            </div>
                        </div>

                        ${renderEatOrder(items)}
                        ${renderNotes(o)}

                        <div class="pt-3 border-t border-slate-800 flex flex-col sm:flex-row justify-between sm:items-center gap-3 text-xs font-bold">
                            <div>
                                <span class="text-slate-400">Tổng Calo Khay Ăn: </span>
                                <span class="text-orange-400 font-extrabold text-sm block sm:inline">${Number(o.total_calories).toLocaleString()} kcal / Mục tiêu: ${Number(o.target_calories_kcal || 0).toLocaleString()} kcal</span>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                ${done
                                    ? `<button onclick="setStatus(${Number(o.id)}, 'pending')" class="${btn} bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">↩️ Hoàn tác</button>`
                                    : o.status === 'preparing'
                                        ? `<button onclick="setStatus(${Number(o.id)}, 'pending')" class="${btn} bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">↩️ Về chờ xử lý</button>
                                           <button onclick="setStatus(${Number(o.id)}, 'completed')" class="${btn} bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black">✅ Đánh dấu hoàn thiện</button>`
                                        : `<button onclick="setStatus(${Number(o.id)}, 'preparing')" class="${btn} bg-blue-500 hover:bg-blue-400 text-white font-black">👨‍🍳 Bắt đầu chuẩn bị</button>
                                           <button onclick="setStatus(${Number(o.id)}, 'completed')" class="${btn} bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black">✅ Hoàn thiện luôn</button>`}
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        async function setStatus(id, status) {
            try {
                const res = await api('PATCH', '/api/orders/' + id, { status });
                const o = allOrders.find(x => x.id === id);
                if (o) {
                    o.status = res.order.status;
                    o.preparing_at = res.order.preparing_at;
                    o.completed_at = res.order.completed_at;
                }
                highlightIds.delete(id);
                renderOrders();
            } catch (err) {
                if (err.message === 'NEED_LOGIN' || err.message.includes('mật khẩu')) return showLogin(err.message);
                statusEl.textContent = '🔴 ' + err.message;
                statusEl.className = 'text-rose-400 font-bold';
            }
        }

        let confirmClear = false;
        async function clearAllOrders() {
            const btn = document.getElementById('btn-clear');
            if (!confirmClear) {
                confirmClear = true;
                btn.textContent = '⚠️ Bấm lần nữa để xóa hết';
                setTimeout(() => { confirmClear = false; btn.textContent = '🗑️ Xóa Lịch Sử Đơn'; }, 4000);
                return;
            }
            confirmClear = false;
            btn.textContent = '🗑️ Xóa Lịch Sử Đơn';
            try {
                await api('DELETE');
                highlightIds.clear();
                knownIds = new Set();
                loadOrders();
            } catch (err) {
                statusEl.textContent = '🔴 ' + err.message;
                statusEl.className = 'text-rose-400 font-bold';
            }
        }

        loadOrders();
        timer = setInterval(loadOrders, POLL_MS);
    </script>
</body>
</html>
